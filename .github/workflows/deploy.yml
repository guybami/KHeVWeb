name: Deploy site to production

on:
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  deploy_staging:
    name: Auto-Deploy to Staging
    if: github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Copy files to Staging folder
        uses: appleboy/scp-action@v0.1.5
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          password: ${{ secrets.DEPLOY_PASSWORD }}
          port: 22
          source: "."
          target: "${{ secrets.DEPLOY_PATH }}/staging"
          rm: false

      - name: Staging Deployment complete
        run: echo "Code pushed to the staging folder. Please test it at your staging URL."

  deploy_production:
    name: Manual Deploy to Production
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Copy files to Production server
        uses: appleboy/scp-action@v0.1.5
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          password: ${{ secrets.DEPLOY_PASSWORD }}
          port: 22
          source: "."
          target: ${{ secrets.DEPLOY_PATH }}
          rm: false

      - name: Delete Staging Environment
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          password: ${{ secrets.DEPLOY_PASSWORD }}
          port: 22
          script: |
            if [ -n "${{ secrets.DEPLOY_PATH }}" ]; then
              echo "Removing staging directory..."
              rm -rf "${{ secrets.DEPLOY_PATH }}/staging"
              echo "Staging environment cleaned up."
            else
              echo "DEPLOY_PATH is empty, skipping deletion to be safe."
            fi

      - name: Deployment complete
        run: echo "Production deployment finished and staging cleaned up."
